[platformio]
default_envs = esp32, esp32c3, esp32c3-devkit, pico
src_dir = firmware

[env]
monitor_speed = 115200

[espidf]
platform = platformio/espressif32@6.12.0
framework = espidf
platform_packages = platformio/framework-espidf@3.50500.0
board_build.partitions = firmware/espidf/partitions.csv

[env:esp32]
extends = espidf
board = esp32dev
build_flags = -DRC_USB_NATIVE=0

[env:esp32c3]
extends = espidf
board = esp32-c3-devkitm-1
build_flags = -DRC_USB_NATIVE=1

[env:esp32c3-devkit]
extends = espidf
board = esp32-c3-devkitm-1
build_flags = -DRC_USB_NATIVE=0

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#c7502925e3b08af70e9f924d54ab9d00a7e64781
board = pico
framework = arduino
board_build.core = earlephilhower
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico/releases/download/4.4.3/rp2040-4.4.3.zip
lib_deps = bblanchon/ArduinoJson@7.4.2
build_src_filter = +<pico/main.cpp>
