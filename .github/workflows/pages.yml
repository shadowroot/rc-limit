name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-web.mjs'
      - 'scripts/package-web.py'
      - 'scripts/fetch-stable-firmware.py'
      - 'scripts/publish-stable-web.py'
      - 'downloads/rc-limit-web.zip'
      - 'scripts/check.sh'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-web.mjs'
      - 'scripts/package-web.py'
      - 'scripts/fetch-stable-firmware.py'
      - 'scripts/publish-stable-web.py'
      - 'downloads/rc-limit-web.zip'
      - 'scripts/check.sh'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web build dependencies
        run: npm ci --ignore-scripts
      - name: Build web bundles
        run: npm run build:web
      - name: Check application and scripts
        run: bash scripts/check.sh
      - name: Verify static download matches the site
        run: python3 scripts/package-web.py --check
      - name: Bundle latest published stable firmware
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-stable-firmware.py
      - name: Package standalone web UI with stable firmware
        run: python3 scripts/package-web.py
      - name: Expose the standalone ZIP on the static site
        run: cp build/releases/rc-limit-web.zip web/rc-limit-web.zip
      - name: Upload standalone web UI
        uses: actions/upload-artifact@v4
        with:
          name: app-web
          path: build/releases/rc-limit-web.zip
          if-no-files-found: error
      - name: Upload static web UI
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy static web UI
        id: deployment
        uses: actions/deploy-pages@v4

  stable-download:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: app-web
          path: build/releases
      - name: Refresh standalone ZIP on the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-stable-web.py
