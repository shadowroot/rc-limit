name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-web.mjs'
      - 'scripts/check.sh'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-web.mjs'
      - 'scripts/check.sh'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web build dependencies
        run: npm ci --ignore-scripts
      - name: Build optional web bundles
        run: npm run build:web --if-present
      - name: Check application and scripts
        run: bash scripts/check.sh
      - name: Upload static web UI
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy static web UI
        id: deployment
        uses: actions/deploy-pages@v4
