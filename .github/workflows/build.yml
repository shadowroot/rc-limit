name: Checks, firmware and releases

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/check.sh

  firmware:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board: [pico, esp32, esp32c3, esp32c3-devkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .tools/platformio/packages
            .tools/platformio/platforms
            .tools/platformio/.cache
          key: pio-${{ runner.os }}-${{ runner.arch }}-${{ matrix.board }}-${{ hashFiles('platformio.ini', 'scripts/requirements-pio.txt') }}
      - name: Install pinned PlatformIO and board packages
        run: bash scripts/setup-pio.sh "${{ matrix.board }}"
      - name: Compile firmware
        run: bash scripts/deploy.sh pio "${{ matrix.board }}" --build-only
      - name: Test native ESP-IDF JSON codec
        if: matrix.board == 'esp32c3'
        run: bash scripts/check-idf.sh
      - name: Package board binaries and flashing instructions
        run: python3 scripts/package-firmware.py "${{ matrix.board }}"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: build/releases/rc-limit-${{ matrix.board }}.zip
          if-no-files-found: error
          retention-days: 14

  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build native Android debug APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Name debug APK
        run: |
          mkdir -p build/releases
          cp android/app/build/outputs/apk/debug/app-debug.apk build/releases/rc-limit-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: build/releases/rc-limit-android-debug.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive Linux desktop and browser app
        run: |
          mkdir -p build/releases
          tar -czf build/releases/rc-limit-desktop-linux-x64.tar.gz -C build/desktop linux-unpacked
          python3 -m zipfile -c build/releases/rc-limit-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: app-desktop-web
          path: build/releases/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Windows x64 installer and portable EXE
        run: npm run package:win
      - name: Collect Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/releases | Out-Null
          $files = @(Get-ChildItem build/desktop/rc-limit-desktop-*-windows-x64-*.exe)
          if ($files.Count -ne 2) { throw "Expected installer and portable EXE; found $($files.Count)" }
          Copy-Item $files.FullName build/releases/
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows-x64
          path: build/releases/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, firmware, android, desktop, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum rc-limit-* > SHA256SUMS
      - name: Create draft release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
